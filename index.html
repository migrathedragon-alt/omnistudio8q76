<!DOCTYPE html><!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OmniStudio AI v3.0 - Ultimate Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #09090b; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
    .canvas-grid { background-image: radial-gradient(#27272a 1.5px, transparent 1.5px); background-size: 24px 24px; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 h-screen w-screen flex flex-col overflow-hidden font-sans select-none">

  <!-- TOP NAVBAR -->
  <header class="h-14 bg-zinc-900 border-b border-zinc-800 flex items-center justify-between px-4 z-20 shrink-0">
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2 text-indigo-500 font-bold text-lg tracking-wider">
        <i class="fa-solid fa-clapperboard"></i> OMNISTUDIO <span class="text-[10px] font-mono bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 px-2 py-0.5 rounded-full">v3.0 ULTIMATE</span>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <button onclick="startTutorial()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition">
        <i class="fa-solid fa-graduation-cap text-indigo-400"></i> <span id="ui-tutorial">Tutorial</span>
      </button>

      <div class="flex items-center gap-1 bg-zinc-800 px-2 py-1 rounded-lg border border-zinc-700 text-xs">
        <i class="fa-solid fa-globe text-zinc-400"></i>
        <select id="lang-select" onchange="changeLanguage(this.value)" class="bg-transparent text-zinc-200 focus:outline-none cursor-pointer">
          <option value="en" selected>English</option>
          <option value="te">తెలుగు (Telugu)</option>
        </select>
      </div>

      <button onclick="openExportModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 shadow-lg transition">
